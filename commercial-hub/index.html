<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Climawell Commercial Hub</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- SIDEBAR MODULARE -->
  <aside class="hub-sidebar">
    <div class="sidebar-brand">
      <div class="brand-badge">CH</div>
      <div class="brand-text">
        <strong>COMMERCIAL HUB</strong>
        <small>Climawell S.r.l.</small>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-link active" data-section="dashboard">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>Dashboard</span>
      </a>

      <a class="nav-link" data-section="customers">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span>Clienti & Privacy</span>
      </a>

      <a class="nav-link" data-section="crm">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
        <span>Pipeline CRM</span>
      </a>

      <a class="nav-link" data-section="products">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
        </svg>
        <span>Catalogo & Listini</span>
      </a>

      <a class="nav-link" data-section="whatsapp">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
        <span>WhatsApp & Brevo</span>
      </a>

      <a class="nav-link" data-section="sync">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        <span>Stato Connettore</span>
      </a>

      <hr style="border:0; border-top:1px solid rgba(255,255,255,0.08); margin:12px 0;">

      <a href="/e-com/?agente=1136" target="_blank" class="nav-link" style="color:#10b981;">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span>🛒 Vetrina E-COM (1136)</span>
      </a>

      <a href="/" class="nav-link" style="color:#38bdf8;">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Torna a OrderSender</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sync-status-card">
        <div class="status-dot"></div>
        <div>
          <strong style="color:#fff; display:block;">PLUS2000 Live</strong>
          <small>SRVPLUS Connesso</small>
        </div>
      </div>
    </div>
  </aside>

  <!-- CONTENUTO PRINCIPALE -->
  <main class="hub-main">
    <header class="hub-topbar">
      <div class="topbar-title">
        <h1 id="hubPageTitle">Dashboard Commerciale & Panoramica</h1>
      </div>
      <div class="topbar-actions">
        <a href="/offerta?new=1&type=offer" class="btn-hub primary">✍️ Nuova Offerta</a>
      </div>
    </header>

    <div class="hub-container" id="hubContentContainer">
      <!-- Il contenuto viene iniettato dinamicamente da app.js -->
    </div>
  </main>

  <script src="/config/companyConfig.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabaseClient.js"></script>
  <script src="app.js"></script>
</body>
</html>
